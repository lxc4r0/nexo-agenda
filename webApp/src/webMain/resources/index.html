<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18392f"><title>Nexo Agenda</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f2}</style></head><body>
<script>
function cargarAgenda() { return localStorage.getItem('nexo.agenda.local'); }
function guardarAgenda(datos) { localStorage.setItem('nexo.agenda.local', datos); }
let audio;
function prepararAudio() {
  const Contexto = window.AudioContext || window.webkitAudioContext;
  if (Contexto) { audio = audio || new Contexto(); audio.resume().catch(() => {}); }
}
function sonarAviso() {
  if (!audio) return;
  audio.resume().then(() => {
    const tono = audio.createOscillator(), volumen = audio.createGain();
    tono.connect(volumen); volumen.connect(audio.destination);
    tono.frequency.value = 740; volumen.gain.setValueAtTime(.15, audio.currentTime);
    volumen.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .5);
    tono.start(); tono.stop(audio.currentTime + .5);
  }).catch(() => {});
}
</script><script src="webApp.js"></script></body></html>
